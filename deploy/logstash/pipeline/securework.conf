# Tails the JSONL event file written by the API and indexes it in Elasticsearch.
# (The API also indexes directly when SECUREWORK_ES_URL is set; both paths use the same index.)
input {
  file {
    path => "/var/log/securework/securework_events.jsonl"
    start_position => "beginning"
    sincedb_path => "/usr/share/logstash/data/sincedb_securework"
    codec => json
  }
}
filter {
  mutate { lowercase => [ "severity" ] }
  mutate { add_field => { "[event][dataset]" => "securework.%{source}" } }
}
output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "securework-events-logstash"
    document_id => "%{event_id}-%{source}-%{@timestamp}"
  }
}
